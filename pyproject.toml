[tool.poetry]
name = "aggregator"
version = "0.1.0"
description = "Freelancehunt job aggregator: parses projects, matches against saved filters, sends Telegram notifications"
authors = ["you <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }, { include = "parser" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
alembic = "^1.13"
asyncpg = "^0.29"
httpx = "^0.27"
python-dotenv = "^1.0"
pydantic-settings = "^2.5"
aiogram = "^3.13"
apscheduler = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
black = "^24.8"
ruff = "^0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
