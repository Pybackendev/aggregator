databases:
  - name: aggregator-db
    plan: free
    databaseName: aggregator
    user: aggregator

services:
  - type: web
    name: aggregator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aggregator-db
          property: connectionString
      - key: FREELANCEHUNT_TOKEN
        sync: false
      - key: FREELANCEHUNT_SKILL_IDS
        value: "22,180"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "15"

  - type: worker
    name: aggregator-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: python -m parser.scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aggregator-db
          property: connectionString
      - key: FREELANCEHUNT_TOKEN
        sync: false
      - key: FREELANCEHUNT_SKILL_IDS
        value: "22,180"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "15"
