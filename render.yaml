databases:
  - name: aggregator-db
    plan: free
    databaseName: aggregator
    user: aggregator

services:
  - type: web
    name: aggregator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aggregator-db
          property: connectionString
      - key: FREELANCEHUNT_TOKEN
        sync: false
      - key: FREELANCEHUNT_SKILL_IDS
        value: "22,180"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYNC_TRIGGER_TOKEN
        sync: false
      # NOTE: Render's free plan doesn't support Cron Jobs or Background Workers
      # (paid-only, from $1/mo). Instead, POST /internal/sync (see app/api/internal.py)
      # is triggered periodically by a free external scheduler — see README for the
      # GitHub Actions workflow that does this.
